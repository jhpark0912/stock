[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E: pycodestyle errors (PEP8 스타일 오류)
# F: pyflakes (미사용 import, 미정의 변수 등)
# I: isort (import 정렬)
# W: pycodestyle warnings
ignore = [
    "E501",  # line-too-long: 긴 문자열/URL/로그 메시지는 줄바꿈 시 가독성 저하
    "E741",  # ambiguous-variable-name: 수학/데이터 처리에서 l, df 등 관용적 사용
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # __init__.py re-export는 미사용 import 허용
"init_database.py" = ["E402"]  # load_dotenv() 후 import 패턴 허용
