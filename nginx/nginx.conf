# Nginx Reverse Proxy 설정 (SSL Termination)
# Let's Encrypt 자동 SSL 인증서 지원

events {
    worker_connections 1024;
}

http {
    # MIME 타입 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 형식
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate Limiting (DDoS 방지)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Upstream 서버 정의
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    # HTTP 서버 (Let's Encrypt ACME Challenge + HTTPS 리디렉션)
    server {
        listen 80;
        listen [::]:80;
        server_name _;  # 모든 도메인 허용 (SSL 인증서 발급 전)

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # HTTP → HTTPS 리디렉션
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 서버 (SSL Termination)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;  # 실제 도메인으로 변경 권장

        # SSL 인증서 경로 (Let's Encrypt)
        # 🔴 중요: 초기 실행 시 인증서가 없으므로 주석 처리 상태로 시작
        # 인증서 발급 후 주석 해제할 것
        # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # SSL 설정 (Mozilla Intermediate 기준)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # OCSP Stapling (인증서 유효성 검증 성능 향상)
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

        # 보안 헤더
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 악성 스캐너 차단
        location ~* \.(php|asp|aspx|jsp|cgi|pl|sh|bash)$ {
            return 444;
        }
        location ~* /(vendor|phpunit|laravel|wp-admin|wp-login|\.git|\.env|\.htaccess)/ {
            return 444;
        }

        # Frontend (React Static Files)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # WebSocket 지원 (향후 필요 시)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # 프록시 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 캐시 비활성화 (SPA 라우팅)
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            # 타임아웃 설정
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Rate Limiting
            limit_req zone=general_limit burst=20 nodelay;
        }

        # Backend API (/api 경로)
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 프록시 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 타임아웃 설정 (AI 분석 등 긴 응답 시간 고려)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Rate Limiting (API 호출 제한)
            limit_req zone=api_limit burst=5 nodelay;

            # CORS는 FastAPI에서 처리하므로 여기서는 설정하지 않음
        }

        # Health Check 엔드포인트 (모니터링 용도)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt ACME Challenge (HTTPS에서도 접근 가능)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
